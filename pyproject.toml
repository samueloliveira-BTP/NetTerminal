[project]
name = "netterminal"
version = "2.1.0"
description = "Gerenciador e terminal SSH/Telnet para OLTs, switches e roteadores"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=6.0.0",
    "paramiko>=3.4.0",
    "cryptography>=42.0.0",
    "pillow>=10.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
